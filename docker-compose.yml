services:
  postgres:
    image: postgres:16-alpine
    platform: linux/amd64
    restart: "no"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: livechat
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    platform: linux/amd64
    restart: "no"
    ports:
      - "57017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    platform: linux/amd64
    restart: "no"
    ports:
      - "56379:6379"

  backend:
    build:
      context: ./backend
    restart: "no"
    depends_on:
      - postgres
      - mongo
      - redis
    env_file:
      - ./backend/.env
    environment:
      PORT: 3000
      CLIENT_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql://postgres:password@postgres:5432/livechat
      MONGO_URL: mongodb://mongo:27017/livechat
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm run dev"

  frontend:
    build:
      context: ./frontend
    restart: "no"
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:3000
      VITE_PROXY_TARGET: http://backend:3000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres-data:
  mongo-data:
