services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # livechat-db (postgres) tourne déjà en dehors de ce compose sur le port 55432
      DATABASE_URL: postgresql://postgres:password@host.docker.internal:55432/livechat
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: sh -c "npx prisma migrate deploy && npm run dev"
